    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <form class="login-container">
            <div class="input-group">
                <label for="title">What is the book's title ?</label>
                <input id="title" type="text" name="title" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="title">Who is the book's author ?</label>
                <input id="author" type="text" name="author" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="title">How many pages are in the books ?</label>
                <input id="pages" type="text" name="pages" autocomplete="off" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="container">
            <div class="card" id="addBook">
                <h1 onclick="openNav()">+</h1>
                
            </div>
            <div class="card">
                <img src="assets/AtomicHabits.jpg" alt="">
                <div class="card-content">
                    <h3>Atomic Habits</h3>
                    <p><strong>James Clear</strong></p>
                    <p><strong>256 Pages</strong></p>
                </div>
                <p><strong>Read Status: </strong>Done</p>
            </div>

            <div class="card">
                <img src="assets/1917.jpg" alt="">
                <div class="card-content">
                    <h3>1917: War, Peace, and Revolution</h3>
                    <p><strong>James Clear</strong></p>
                    <p><strong>430 Pages</strong></p>
                </div>
                <p><strong>Read Status: </strong>Done</p>
            </div>

            <div class="card">
                <img src="assets/ParadiseKiss.jpg" alt="">
                <div class="card-content">
                    <h3>Paradise Kiss</h3>
                    <p><strong>Ai Yazawa</strong></p>
                    <p><strong>858 Pages</strong></p>
                </div>

                <p><strong>Read Status: </strong>Done</p>
            </div>
    </div>
