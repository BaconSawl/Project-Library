    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <form class="form-container">
            <div class="input-group">
                <label for="title">What is the book's title ?</label>
                <input id="title" type="text" name="title" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="author">Who is the book's author ?</label>
                <input id="author" type="text" name="author" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="pages">How many pages are in the book ?</label>
                <input id="pages" type="number" name="pages" autocomplete="off" min="1" max="" required>
            </div>
            <div>
                <label for="readStatus">Have you finished reading it ?</label>
                <select id="readStatus" name="readStatus">
                    <option value="Haven't Read">Haven't Read</option>
                    <option value="Reading" selected>Reading</option>
                    <option value="Done">Have Read</option>
                </select>
            </div>

            <button id="submit" type="submit">Submit</button>
        </form>
    </div>
